    <!--
      Meta Pixel Code — Pixel ID da verificare prima del go-live.
      Scommentare quando l'ID definitivo sarà confermato (sostituire __PIXEL_ID_DA_VERIFICARE__).

      <script>
        !(function (f, b, e, v, n, t, s) {
          if (f.fbq) return
          n = f.fbq = function () {
            n.callMethod
              ? n.callMethod.apply(n, arguments)
              : n.queue.push(arguments)
          }
          if (!f._fbq) f._fbq = n
          n.push = n
          n.loaded = !0
          n.version = '2.0'
          n.queue = []
          t = b.createElement(e)
          t.async = !0
          t.src = v
          s = b.getElementsByTagName(e)[0]
          s.parentNode.insertBefore(t, s)
        })(
          window,
          document,
          'script',
          'https://connect.facebook.net/en_US/fbevents.js',
        )
        fbq('init', '__PIXEL_ID_DA_VERIFICARE__')
        fbq('track', 'PageView')
      </script>
      <noscript>
        <img
          height="1"
          width="1"
          style="display: none"
          src="https://www.facebook.com/tr?id=__PIXEL_ID_DA_VERIFICARE__&ev=PageView&noscript=1"
          alt=""
        />
      </noscript>
      End Meta Pixel Code
